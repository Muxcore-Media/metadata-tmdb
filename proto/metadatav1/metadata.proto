syntax = "proto3";
package muxcore.metadata.v1;
option go_package = "github.com/Muxcore-Media/metadata-tmdb/proto/metadatav1;metadatav1";

service MetadataService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetMovieDetails(GetMovieDetailsRequest) returns (GetMovieDetailsResponse);
  rpc GetTVDetails(GetTVDetailsRequest) returns (GetTVDetailsResponse);
  rpc GetSeasonDetails(GetSeasonDetailsRequest) returns (GetSeasonDetailsResponse);
  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse);
  rpc GetConfiguration(GetConfigurationRequest) returns (GetConfigurationResponse);
  rpc ListTrending(ListTrendingRequest) returns (ListTrendingResponse);
  rpc ListPopular(ListPopularRequest) returns (ListPopularResponse);
  rpc FindByExternalID(FindByExternalIDRequest) returns (FindByExternalIDResponse);
  rpc GetAlternativeTitles(GetAlternativeTitlesRequest) returns (GetAlternativeTitlesResponse);
}

message SearchRequest {
  string query = 1;
  MediaType type = 2;
  int32 page = 3;
  string language = 4;
  int32 year = 5;
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_MOVIE = 1;
  MEDIA_TYPE_TV = 2;
}

message SearchResponse {
  repeated SearchResult results = 1;
  int32 total_results = 2;
  int32 total_pages = 3;
  int32 page = 4;
}

message SearchResult {
  int32 id = 1;
  string title = 2;
  string original_title = 3;
  string overview = 4;
  string poster_path = 5;
  string backdrop_path = 6;
  double vote_average = 7;
  int32 vote_count = 8;
  string release_date = 9;
  MediaType media_type = 10;
  repeated int32 genre_ids = 11;
  string original_language = 12;
  double popularity = 13;
  string name = 14;
  string first_air_date = 15;
}

message GetMovieDetailsRequest {
  int32 tmdb_id = 1;
  string language = 2;
  repeated string append_to_response = 3;
}

message GetMovieDetailsResponse {
  int32 id = 1;
  string title = 2;
  string original_title = 3;
  string overview = 4;
  string tagline = 5;
  string poster_path = 6;
  string backdrop_path = 7;
  string release_date = 8;
  int32 runtime = 9;
  double vote_average = 10;
  int32 vote_count = 11;
  double popularity = 12;
  string status = 13;
  string original_language = 14;
  bool adult = 15;
  int64 budget = 16;
  int64 revenue = 17;
  string homepage = 18;
  string imdb_id = 19;
  repeated Genre genres = 20;
  repeated ProductionCompany production_companies = 21;
  repeated SpokenLanguage spoken_languages = 22;
  string backdrop_url = 23;
  string poster_url = 24;
  repeated Video videos = 25;
  repeated Credits credits = 26;
  Collection belongs_to_collection = 27;
  // Must match contracts-metadata GetMovieDetailsResponse tags 28/29 exactly.
  // Raw TMDB release_dates certification for certification_country (e.g. "PG-13");
  // empty when none. Media modules map it (ADR-0031 §2); unknown/empty = unavailable.
  string certification = 28;
  string certification_country = 29;
}

message Collection {
  int32 id = 1;
  string name = 2;
  string poster_path = 3;
  string backdrop_path = 4;
}

message GetCollectionRequest {
  int32 tmdb_id = 1;
  string language = 2;
}

message GetCollectionResponse {
  int32 id = 1;
  string name = 2;
  string overview = 3;
  string poster_path = 4;
  string backdrop_path = 5;
  repeated CollectionPart parts = 6;
}

message CollectionPart {
  int32 id = 1;
  string title = 2;
  string original_title = 3;
  string overview = 4;
  string poster_path = 5;
  string backdrop_path = 6;
  string release_date = 7;
  double vote_average = 8;
  MediaType media_type = 9;
}

message Genre {
  int32 id = 1;
  string name = 2;
}

message ProductionCompany {
  int32 id = 1;
  string name = 2;
  string logo_path = 3;
  string origin_country = 4;
}

message SpokenLanguage {
  string iso_639_1 = 1;
  string name = 2;
}

message Video {
  string id = 1;
  string key = 2;
  string name = 3;
  string site = 4;
  string type = 5;
}

message Credits {
  repeated CastMember cast = 1;
  repeated CrewMember crew = 2;
}

message CastMember {
  int32 id = 1;
  string name = 2;
  string character = 3;
  string profile_path = 4;
  int32 order = 5;
}

message CrewMember {
  int32 id = 1;
  string name = 2;
  string job = 3;
  string department = 4;
  string profile_path = 5;
}

message GetTVDetailsRequest {
  int32 tmdb_id = 1;
  string language = 2;
  repeated string append_to_response = 3;
}

message GetTVDetailsResponse {
  int32 id = 1;
  string name = 2;
  string original_name = 3;
  string overview = 4;
  string tagline = 5;
  string poster_path = 6;
  string backdrop_path = 7;
  string first_air_date = 8;
  string last_air_date = 9;
  int32 number_of_seasons = 10;
  int32 number_of_episodes = 11;
  double vote_average = 12;
  int32 vote_count = 13;
  double popularity = 14;
  string status = 15;
  string original_language = 16;
  string homepage = 17;
  string in_production = 18;
  repeated Genre genres = 19;
  repeated Season seasons = 20;
  repeated ProductionCompany production_companies = 21;
  repeated SpokenLanguage spoken_languages = 22;
  string backdrop_url = 23;
  string poster_url = 24;
  repeated Video videos = 25;
  repeated Credits credits = 26;
  repeated CreatedBy created_by = 27;
  repeated Network networks = 28;
  repeated string origin_country = 29;
  // Tags 30-32 are used by contracts-metadata (in_production bool, imdb_id, tvdb_id);
  // do not reuse them here with another type.
  // Must match contracts-metadata GetTVDetailsResponse tags 33/34 exactly.
  // Raw TMDB content_ratings rating for certification_country (e.g. "TV-MA");
  // empty when none. Media modules map it (ADR-0031 §2); unknown/empty = unavailable.
  string certification = 33;
  string certification_country = 34;
}

message CreatedBy {
  int32 id = 1;
  string name = 2;
  string profile_path = 3;
}

message Network {
  int32 id = 1;
  string name = 2;
  string logo_path = 3;
  string origin_country = 4;
}

message Season {
  int32 id = 1;
  string name = 2;
  string overview = 3;
  string poster_path = 4;
  string air_date = 5;
  int32 season_number = 6;
  int32 episode_count = 7;
  double vote_average = 8;
}

message GetSeasonDetailsRequest {
  int32 tmdb_id = 1;
  int32 season_number = 2;
  string language = 3;
}

message Episode {
  int32 id = 1;
  string name = 2;
  string overview = 3;
  string air_date = 4;
  int32 episode_number = 5;
  int32 season_number = 6;
  string still_path = 7;
  int32 runtime = 8;
  double vote_average = 9;
  int32 vote_count = 10;
  string production_code = 11;
}

message GetSeasonDetailsResponse {
  int32 id = 1;
  string name = 2;
  string overview = 3;
  string poster_path = 4;
  string air_date = 5;
  int32 season_number = 6;
  double vote_average = 7;
  repeated Episode episodes = 8;
}

message GetConfigurationRequest {}

message GetConfigurationResponse {
  string base_url = 1;
  repeated string poster_sizes = 2;
  repeated string backdrop_sizes = 3;
  repeated string logo_sizes = 4;
  repeated string profile_sizes = 5;
  repeated string still_sizes = 6;
  string secure_base_url = 7;
}

message ListTrendingRequest {
  TrendingMediaType media_type = 1;
  TrendingTimeWindow time_window = 2;
  int32 page = 3;
  string language = 4;
}

enum TrendingMediaType {
  TRENDING_MEDIA_TYPE_UNSPECIFIED = 0;
  TRENDING_MEDIA_TYPE_ALL = 1;
  TRENDING_MEDIA_TYPE_MOVIE = 2;
  TRENDING_MEDIA_TYPE_TV = 3;
}

enum TrendingTimeWindow {
  TRENDING_TIME_WINDOW_UNSPECIFIED = 0;
  TRENDING_TIME_WINDOW_DAY = 1;
  TRENDING_TIME_WINDOW_WEEK = 2;
}

message ListTrendingResponse {
  repeated SearchResult results = 1;
  int32 total_results = 2;
  int32 total_pages = 3;
  int32 page = 4;
}

message ListPopularRequest {
  MediaType type = 1;
  int32 page = 2;
  string language = 3;
}

message ListPopularResponse {
  repeated SearchResult results = 1;
  int32 total_results = 2;
  int32 total_pages = 3;
  int32 page = 4;
}

message FindByExternalIDRequest {
  string external_id = 1;
  string external_source = 2; // e.g. "imdb_id"
  string language = 3;
}

message FindByExternalIDResponse {
  repeated SearchResult results = 1;
}

message GetAlternativeTitlesRequest {
  int32 tmdb_id = 1;
  MediaType type = 2;
}

message AlternativeTitle {
  string title = 1;
  string type = 2; // country / iso / title type from TMDB
}

message GetAlternativeTitlesResponse {
  int32 tmdb_id = 1;
  repeated AlternativeTitle titles = 2;
}
